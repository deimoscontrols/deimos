        orientation: "h",
        x: 0,
        xanchor: "left",
        y: 1.02,
        yanchor: "bottom"
    }
};

const singleRowLegend = {
    ...baseLayout.legend,
    y: 1.12,
    entrywidth: 105,
    entrywidthmode: "pixels"
};

function themedLayout(layout) {
    return {
        ...baseLayout,
        ...layout,
        xaxis: {
            gridcolor: gridColor,
            zerolinecolor: gridColor,
            linecolor: gridColor,
            tickcolor: gridColor,
            ...layout.xaxis
        },
        yaxis: {
            gridcolor: gridColor,
            zerolinecolor: gridColor,
            linecolor: gridColor,
            tickcolor: gridColor,
            ...layout.yaxis
        }
    };
}

Plotly.newPlot("time-overlay", [
    {
        x: rawTimeS,
        y: rawMeasuredMA,
        mode: "lines",
        type: "scatter",
        name: "Measured",
        line: { width: 1, color: traceColor }
    },
    {
        x: referenceStepTimeS,
        y: referenceStepMA,
        mode: "lines",
        type: "scatter",
        name: "Detected reference step",
        connectgaps: false,
        line: { width: 2, color: traceColor, dash: "dash" }
    }
], themedLayout({
    title: { text: "Detected steps and accepted calibration regions" },
    xaxis: { title: { text: "Time (s)", standoff: 16 }, automargin: true },
    yaxis: { title: { text: "Voltage (V)", standoff: 18 }, automargin: true },
    shapes: acceptedShapes,
    margin: { l: 88, r: 24, t: 72, b: 78 }
}), { responsive: true });

Plotly.newPlot("relative-error", [
    {
        x: errorAccuracyX,
        y: errorAccuracyY,
        mode: "lines",
        type: "scatter",
        fill: "toself",
        name: "Keithley DMM6500 one-year accuracy (10 V range, Tcal ±5°C)",
        line: { width: 0, color: accuracyFillColor },
        fillcolor: accuracyFillColor,
        hoverinfo: "skip"
    },
    {
        x: acceptedReference,
        y: errorPlotY,
        type: "box",
        name: "Error distribution",
        showlegend: false,
        boxpoints: false,
        boxmean: "sd",
        line: { width: 2, color: traceColor },
        fillcolor: boxFillColor,
        marker: { color: traceColor }
    },
    {
        x: acceptedReference,
        y: errorPlotY,
        mode: "markers",
        type: "scatter",
        name: "Samples",
        opacity: 0.5,
        marker: { symbol: "line-ew", size: 8, color: traceColor, line: { width: 1, color: traceColor } }
    },
    {
        x: errorMeanX,
        y: errorMeanY,
        mode: "markers",
        type: "scatter",
        name: "Mean",
        marker: { symbol: "diamond", size: 9, color: statisticColor }
    },
    {
        x: errorUncertaintyX,
        y: errorUncertaintyY,
        mode: "markers",
        type: "scatter",
        name: "3σ mean",
        marker: { symbol: "line-ew", size: 16, color: statisticColor, line: { width: 2, color: statisticColor } }
    }
], themedLayout({
    title: { text: "Voltage error vs reference", y: 1.02, yanchor: "bottom" },
    xaxis: { title: { text: "Reference voltage (V)", standoff: 16 }, automargin: true },
    yaxis: { title: { text: "Error (V)", standoff: 18 }, range: errorYAxisRange, automargin: true },
    legend: singleRowLegend,
    boxmode: "group",
    margin: { l: 88, r: 24, t: 160, b: 78 }
}), { responsive: true });

Plotly.newPlot("voltage-fit", [
    {
        x: fitMeasuredX,
        y: fitExpectedY,
        mode: "markers",
        type: "scatter",
        name: "Accepted calibration samples",
        marker: { size: 5, color: traceColor }
    },
    {
        x: fitLineX,
        y: fitLineY,
        mode: "lines",
        type: "scatter",
        name: "Linear fit",
        line: { width: 2, color: traceColor }
    }
], themedLayout({
    title: { text: "Expected voltage vs measured voltage" },
    xaxis: { title: { text: "Measured voltage (V)", standoff: 16 }, automargin: true },
    yaxis: { title: { text: "Expected voltage (V)", standoff: 18 }, automargin: true },
    margin: { l: 88, r: 24, t: 72, b: 78 }
}), { responsive: true });

Plotly.newPlot("voltage-fit-residual", [
    {
        x: residualAccuracyX,
        y: residualAccuracyY,
        mode: "lines",
        type: "scatter",
        fill: "toself",
        name: "Keithley DMM6500 one-year accuracy (10 V range, Tcal ±5°C)",
        line: { width: 0, color: accuracyFillColor },
        fillcolor: accuracyFillColor,
        hoverinfo: "skip"
    },
    {
        x: fitResidualReference,
        y: fitResidualY,
        type: "box",
        name: "Residual distribution",
        showlegend: false,
        boxpoints: false,
        boxmean: "sd",
        line: { width: 2, color: traceColor },
        fillcolor: boxFillColor,
        marker: { color: traceColor }
    },
    {
        x: fitResidualReference,
        y: fitResidualY,
        mode: "markers",
        type: "scatter",
        name: "Voltage fit residual",
        opacity: 0.5,
        marker: { symbol: "line-ew", size: 8, color: traceColor, line: { width: 1, color: traceColor } }
    },
    {
        x: residualMeanX,
        y: residualMeanY,
        mode: "markers",
        type: "scatter",
        name: "Mean",
        marker: { symbol: "diamond", size: 9, color: statisticColor }
    },
    {
        x: residualUncertaintyX,
        y: residualUncertaintyY,
        mode: "markers",
        type: "scatter",
        name: "3σ mean",
        marker: { symbol: "line-ew", size: 16, color: statisticColor, line: { width: 2, color: statisticColor } }
    }
], themedLayout({
    title: { text: "Residual after voltage fit", y: 1.02, yanchor: "bottom" },
    xaxis: { title: { text: "Reference voltage (V)", standoff: 16 }, automargin: true },
    yaxis: { title: { text: "Voltage residual (V)", standoff: 18 }, range: residualYAxisRange, automargin: true },
    legend: singleRowLegend,
    boxmode: "group",
    margin: { l: 88, r: 24, t: 160, b: 78 }
}), { responsive: true });


</script>
</body>
</html>
