    font: { color: textColor },
    legend: {
        font: { color: textColor },

};

    return {
        ...baseLayout,
        ...layout,
        xaxis: {
            gridcolor: gridColor,
            zerolinecolor: gridColor,
            linecolor: gridColor,
            tickcolor: gridColor,
