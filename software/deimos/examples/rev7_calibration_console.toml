# Operator console config for `software/deimos/examples/rev7_0_0_calibration.rs`.
# Run with:
# cargo run -p deimos_console -- --config software/deimos/examples/rev7_calibration_console.toml

multicast_group = "239.255.0.1"
port = 29573
window_seconds = 90.0
staleness_threshold_secs = 3.0
forensic_log_path = "/tmp/deimos-rev7-calibration-console.csv"
columns = 2

[[panels]]
title = "Rev7 4-20 mA Inputs"
channels = [
    "p1.4_20_0_A",
    "p1.4_20_1_A",
    "p1.4_20_2_A",
    "p1.4_20_3_A",
]

[[panels]]
title = "Rev7 RTD Inputs"
channels = [
    "p1_rtd_0.temperature_K",
    "p1_rtd_1.temperature_K",
    "p1_rtd_2.temperature_K",
]

[[panels]]
title = "Rev7 Thermocouple Inputs"
channels = [
    "p1.tc_0_K",
    "p1.tc_1_K",
    "p1.board_temp_K",
]

[[panels]]
title = "Rev7 0-2.5 V Inputs"
channels = [
    "p1.2V5_0_V",
    "p1.2V5_1_V",
]

[[panels]]
title = "Rev7 0-15 V Inputs"
channels = [
    "p1.15V_0_V",
    "p1.15V_1_V",
]

[[panels]]
title = "Rev7 26x Voltage Inputs"
channels = [
    "p1.35mV_0_V",
    "p1.35mV_1_V",
]
