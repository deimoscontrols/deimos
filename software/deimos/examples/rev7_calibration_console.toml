# Operator console config for `software/deimos/examples/rev7_calibration.rs`.
# Run with:
# cargo run -p deimos_console -- --config software/deimos/examples/rev7_calibration_console.toml

multicast_group = "239.255.0.1"
port = 29573
window_seconds = 90.0
staleness_threshold_secs = 3.0
forensic_log_path = "/tmp/deimos-rev7-calibration-console.csv"
columns = 2

[[panels]]
title = "Rev7 4-20 mA Inputs"
channels = [
    "p1.current_4_20_0_A",
    "p1.current_4_20_1_A",
    "p1.current_4_20_2_A",
    "p1.current_4_20_3_A",
]

[[panels]]
title = "Rev7 RTD Inputs"
channels = [
    "p1_rtd_0.temperature_K",
    "p1_rtd_1.temperature_K",
    "p1_rtd_2.temperature_K",
]

[[panels]]
title = "Rev7 Thermocouple Inputs"
channels = [
    "p1.thermocouple_0_temperature_K",
    "p1.thermocouple_1_temperature_K",
    "p1.board_temperature_K",
]

[[panels]]
title = "Rev7 0-2.5 V Inputs"
channels = [
    "p1.voltage_0_2V5_0_V",
    "p1.voltage_0_2V5_1_V",
]

[[panels]]
title = "Rev7 0-15 V Inputs"
channels = [
    "p1.voltage_0_15_0_V",
    "p1.voltage_0_15_1_V",
]

[[panels]]
title = "Rev7 26x Voltage Inputs"
channels = [
    "p1.voltage_x26_0_V",
    "p1.voltage_x26_1_V",
]
