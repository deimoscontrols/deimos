[package]
name = "deimos"
version.workspace = true
edition = "2024"
authors = ["Deimos Controls LLC <support@deimoscontrols.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/deimoscontrols/deimos/software/deimos"
homepage = "https://github.com/deimoscontrols/deimos"
description = "Control-loop and data pipeline for the Deimos data acquisition system"
readme = "./README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["rlib", "cdylib"]

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--extend-css", "docs/rustdoc.css", "--default-theme", "dark"]

[dependencies]
# Packet formats and math shared with hardware
deimos_shared = { path = "../deimos_shared", version = "0.18.0" }
deimos_numerics = { path = "../deimos_numerics", version = "0.18.0" }

# Control loop
chrono = { version = "^0.4.42", features = ["std"], default-features = false }  # timestamp formatting
core_affinity = "^0.8.3"
branches = { version = "^0.4.4", default-features = false }
socket2 = "^0.6.4"
network-interface = "^2.0"
reqwest = { version = "^0.13.4", default-features = false, features = ["blocking", "rustls"] }

# Calcs
interpn = { version = "^0.11.2", default-features = false, features = ["fma"] }
once_cell = "^1.21.3"
nalgebra = "^0.34"
levenberg-marquardt = "^0.15.0"

# Sideloading support
crossbeam = "^0.8.4"

# Serialization
# Loose versioning enables plugins without multiple crate versions per build
serde = { version = "^1", features = ["derive", "rc"] }
typetag = "^0.2"
serde_json = { version = "^1", features = ["preserve_order"] }
csv = "^1.4.0"
postcard = { version = "1", features = ["alloc"] }
zip = "^8"

# Timescale DB / Postgres interface
postgres = "^0.19.10"
postgres-types = "^0.2.9"

# Logging
tracing = "^0.1.41"
tracing-appender = "^0.2.3"
tracing-subscriber = { version = "^0.3.20", features = ["fmt", "env-filter", "chrono"] }

# Python bindings
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311", "generate-import-lib"], optional = true }

[dev-dependencies]
# Uncertainty analysis
num-dual = "0.13.6"
rand = "0.10.2"
ndarray = "0.17.2"
plotly = "0.14.1"

[features]
# default = ["python"]  # For development
default = []
python = ["pyo3"]
