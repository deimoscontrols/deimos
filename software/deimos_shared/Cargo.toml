[package]
name = "deimos_shared"
version.workspace = true
edition = "2021"
authors = ["Deimos Controls LLC <support@deimoscontrols.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/deimoscontrols/deimos/software/deimos_shared"
homepage = "https://github.com/deimoscontrols/deimos"
description = "Shared packet formats and related resources for Deimos DAQ ecosystem"
readme = "./README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata."docs.rs"]
all-features = true
rustdoc-args = ["--extend-css", "docs/rustdoc.css", "--default-theme", "dark"]

[dependencies]
byte_struct = "0.9.0"
deimos_numerics = { path = "../deimos_numerics", version = "0.21.1", default-features = false, optional = true }

# `interpn` is no-std on the firmware target. Do not enable its `fma` feature
# there: fused multiply-add is slower than separate multiply and add on the
# rev7 STM32H7. Its published crate also includes a `cdylib`, so host-side tests
# need its `std` feature to supply the linker runtime for that additional crate
# type.
[target.'cfg(target_os = "none")'.dependencies]
interpn = { version = "^0.11.2", default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
interpn = { version = "^0.11.2", default-features = false, features = ["fma", "std"] }

[dev-dependencies]
plotly = { version = "0.14.1", features = ["static_export_default"] }
serde_json = "1"

[features]
default = []
alloc = ["dep:deimos_numerics", "deimos_numerics/alloc"]
# Place selected real-time resources in firmware-provided TCM sections.
tcm = []

[[example]]
name = "rev7_bode"
required-features = ["alloc"]
