[package]
name = "deimos_bare_metal"
version = "0.8.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 3

[dependencies]
cortex-m = { version = "^0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
stm32h7xx-hal = { version = "0.16.0", features=["rt", "revision_v", "stm32h743v", "ethernet"] }
#stm32h7xx-hal = { path = "../../../../stm32h7xx-hal", features=["rt", "revision_v", "stm32h743v", "ethernet"] }
nb = "1.1.0"
irq = "0.2.3"
atomic_float = "1.1.0"
array-macro = "2.1.8"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }

deimos_shared = { path = "../../software/deimos_shared", version="0.18.0", features = ["alloc", "tcm"] }
deimos_numerics = { path = "../../software/deimos_numerics", version="0.18.0" }
rmodbus = { version = "0.12.2", default-features = false }
cortex-m-stack = { version = "0.2.1", optional = true }

[dependencies.smoltcp]
version = "0.11.0"
default-features = false
features = ["medium-ethernet", "proto-ipv4", "socket-raw", "socket-udp", "socket-tcp", "socket-dhcpv4"]

[features]
# Test-only startup stack painting for an on-target MSP high-water measurement.
# It has no effect on the production image unless selected explicitly.
stack-watermark = ["dep:cortex-m-stack"]
# Test-only minimum cycle-margin recorder, read later through the debug probe.
timing-watermark = []
